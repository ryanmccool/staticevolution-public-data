name: Back up Static Evolution public data

on:
  workflow_dispatch:
  schedule:
    - cron: "26 9 * * *"

concurrency:
  group: public-data-backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --requirement requirements.txt
      - name: Verify public export boundary
        run: python -m unittest
      - name: Export published rows
        env:
          DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
        run: python export.py
      - name: Build deterministic source snapshot
        run: |
          rm -f data/*
          sqlite-diffable dump staticevolution.db data --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-data
          path: data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -f data/*
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-data
          path: data
      - name: Commit changed public data
        run: |
          git config user.name "Static Evolution backup"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public data"
          git push
